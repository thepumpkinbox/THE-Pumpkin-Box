<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE Pumpkin Box - Discography</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        header h1 {
            font-size: 2.2rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        
        /* Discography Grid */
        .discography-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 32px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background-color: #141414;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #222;
            transition: transform 0.2s ease, border-color 0.2s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: #555;
        }
        .jacket {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #222;
        }
        .jacket img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .info {
            padding: 16px;
            text-align: center;
        }
        .title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .artist {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 12px;
        }
        .tunecore-btn {
            display: inline-block;
            width: 100%;
            padding: 10px 0;
            background: linear-gradient(135deg, #2b2b2b, #1a1a1a);
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.05em;
        }
        .card:hover .tunecore-btn {
            background: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <header>
        <h1>THE Pumpkin Box</h1>
    </header>

    <main class="discography-grid">

        <!-- Yakou -->
        <!-- href に各自の TuneCore / LinkCore URL を入れます -->
        <a href="https://linkcore.co/xxxxxx" target="_blank" class="card">
            <div class="jacket">
                <!-- GitHubに上げた画像ファイル名を入力 -->
                <img src="yakou.jpg" alt="Yakou (夜行)">
            </div>
            <div class="info">
                <div class="title">Yakou (夜行)</div>
                <div class="artist">THE Pumpkin Box</div>
                <div class="tunecore-btn">Stream / Download</div>
            </div>
        </a>

        <!-- Pacific Ocean -->
        <a href="https://linkcore.co/xxxxxx" target="_blank" class="card">
            <div class="jacket">
                <img src="pacific_ocean.jpg" alt="Pacific Ocean">
            </div>
            <div class="info">
                <div class="title">Pacific Ocean</div>
                <div class="artist">THE Pumpkin Box</div>
                <div class="tunecore-btn">Stream / Download</div>
            </div>
        </a>

    </main>

</body>
