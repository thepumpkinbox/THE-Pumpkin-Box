<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>THE Pumpkin Box</title>

<style>

body{

margin:0;

height:100vh;

background:black;

display:flex;

justify-content:center;

align-items:center;

color:white;

font-family:Arial;

}

.loading{

font-size:40px;

letter-spacing:8px;

}

.moon{

font-size:80px;

animation: glow 3s infinite;

}

@keyframes glow{

0%{

filter:brightness(0.5);

}

50%{

filter:brightness(1.5);

}

100%{

filter:brightness(0.5);

}

}

</style>

</head>

<body>

<div class="loading">

<div class="moon">

🌕

</div>

<br>

THE Pumpkin Box

</div>

</body>

</html>
