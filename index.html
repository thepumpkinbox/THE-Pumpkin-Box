<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE Pumpkin Box</title>
  <style>
    /* 全体設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ローディングコンテナ */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 月のアニメーション描画部分 */
    .moon-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      /* 満月のベース（ベースのうっすら光る影） */
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e0e0e0 60%, #888888 100%);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }

    /* 月の影（JavaScriptで角度と位置を動かして満ち欠けを作る） */
    .moon-shadow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0a0a0a;
      border-radius: 50%;
      /* 進行度に合わせて右へ移動していく */
      transform: translateX(0%);
      transition: transform 0.1s linear;
    }

    /* カウントアップ表示 */
    .counter {
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 4px;
      color: #888888;
    }

    /* ブランドロゴ */
    .logo {
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 16px;
      text-indent: 16px; /* letter-spacingの右ズレ補正 */
      text-transform: uppercase;
      color: #ffffff;
      opacity: 0.9;
    }

    /* メインコンテンツ（ローディング完了後に表示されるエリア） */
    .main-content {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
      text-align: center;
    }

    .main-content.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .main-title {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 20px;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 12px;
      letter-spacing: 6px;
      color: #666;
    }
  </style>
</head>
<body>

  <!-- ローディング画面 -->
  <div class="loading-container" id="loading">
    <div class="moon-wrapper">
      <div class="moon-shadow" id="moonShadow"></div>
    </div>
    
    <div class="counter"><span id="percent">0</span>%</div>
    
    <div class="logo">THE PUMPKIN BOX</div>
  </div>

  <!-- 読み込み完了後の画面 -->
  <div class="main-content" id="mainContent">
    <h1 class="main-title">THE PUMPKIN BOX</h1>
    <p class="subtitle">WELCOME</p>
  </div>

  <script>
    const percentEl = document.getElementById('percent');
    const moonShadow = document.getElementById('moonShadow');
    const loadingEl = document.getElementById('loading');
    const mainContentEl = document.getElementById('mainContent');

    let progress = 0;

    // 0%から100%へカウントアップさせるタイマー
    const interval = setInterval(() => {
      progress += 1;

      // 数値を更新
      percentEl.textContent = progress;

      // 影の位置を移動させて月を満ちていくように見せる (0%で100%カバー、100%で完全に消える)
      moonShadow.style.transform = `translateX(${progress}%)`;

      // 100%に達したらローディング終了処理
      if (progress >= 100) {
        clearInterval(interval);
        
        setTimeout(() => {
          // ローディングをフェードアウト
          loadingEl.style.opacity = '0';
          
          setTimeout(() => {
            loadingEl.style.display = 'none';
            // メインコンテンツを表示
            mainContentEl.classList.add('visible');
          }, 1200);
        }, 500);
      }
    }, 30); // 速度調整（数字を小さくすると早くなります）
  </script>
</body>
</html>
